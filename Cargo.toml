[package]
name = "didcomm-mcp"
version = "0.1.1"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/wyvrn-cloud/mcp"
description = "An MCP server that lets AI agents discover, learn and use DIDComm protocols with any peer"
publish = false

[profile.release]
strip = true
lto = "thin"

[[bin]]
name = "didcomm-mcp"
path = "src/main.rs"

[dependencies]
# Pinned to a commit, so every build -- `cargo install` without --locked too -- gets the
# didcomm this release was tested with. Bump it deliberately (and run the tests).
didcomm-agent = { git = "https://github.com/wyvrn-cloud/didcomm", rev = "4ba7a14f439b47861ac10efad320cfc03acb378c" }
anyhow = "1"
axum = "0.8"
# Validates outgoing messages against the registry's schemas.
jsonschema = { version = "0.33", default-features = false }
rmcp = { version = "3.5", features = ["server", "transport-io", "transport-streamable-http-server", "macros", "schemars"] }
schemars = "1"
# The registry's didcomm_versions are semver requirements (^1.0, ^2.0).
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "io-std", "net", "signal"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

# `didcomm-mcp service install` on Windows, and running as that service.
[target.'cfg(windows)'.dependencies]
windows-service = "0.8"

[dev-dependencies]
base64 = "0.22"
reqwest = { version = "0.13", features = ["json"] }
didcomm-mediator-core = { git = "https://github.com/wyvrn-cloud/didcomm", rev = "4ba7a14f439b47861ac10efad320cfc03acb378c" }
didcomm-quickstart = { git = "https://github.com/wyvrn-cloud/didcomm", rev = "4ba7a14f439b47861ac10efad320cfc03acb378c" }
rmcp = { version = "3.5", features = ["client", "transport-async-rw", "transport-streamable-http-client-reqwest"] }
