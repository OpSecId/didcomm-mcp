name: Release

# Pushing a tag vX.Y.Z (matching Cargo.toml's version) builds didcomm-mcp for every
# platform below, smoke-tests each build on its own OS (including installing it as a
# system service), and publishes a GitHub release with the archives and SHA256SUMS.
# Pull requests that touch the release path, and manual runs, do everything but publish.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/scripts/**
      - src/main.rs
      - src/service/**
      - Cargo.toml
      - Cargo.lock
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Static (musl) binaries run on any Linux distribution.
          - { target: x86_64-unknown-linux-musl, os: ubuntu-24.04, service: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, service: true }
          - { target: aarch64-apple-darwin, os: macos-15, service: true }
          # Built on Apple silicon; smoke-tested there under Rosetta.
          - { target: x86_64-apple-darwin, os: macos-15, service: false }
          - { target: x86_64-pc-windows-msvc, os: windows-2025, service: true }
          - { target: aarch64-pc-windows-msvc, os: windows-11-arm, service: true }
    env:
      # aws-lc-rs' C build ignores cargo's -j.
      CMAKE_BUILD_PARALLEL_LEVEL: "4"
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: version
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME doesn't match Cargo.toml's version $version"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: contains(matrix.target, 'linux-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        shell: bash
        env:
          # No dependency on the Visual C++ runtime being installed.
          RUSTFLAGS: ${{ contains(matrix.target, 'windows') && '-C target-feature=+crt-static' || '' }}
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: ${{ contains(matrix.target, 'windows') && 'python' || 'python3' }} .github/scripts/package.py ${{ matrix.target }}

      # The service test runs the binary from where people install it: a system service
      # on Linux can't see home directories.
      - name: Smoke test (Linux, macOS)
        if: "!contains(matrix.target, 'windows')"
        run: |
          sudo mkdir -p /usr/local/bin
          sudo install -m 755 target/${{ matrix.target }}/release/didcomm-mcp /usr/local/bin/didcomm-mcp
          sudo python3 .github/scripts/smoke_test.py /usr/local/bin/didcomm-mcp \
            --version ${{ steps.version.outputs.version }} ${{ matrix.service && '--service' || '' }}

      - name: Smoke test (Windows)
        if: contains(matrix.target, 'windows')
        shell: pwsh
        run: |
          $dir = "$env:ProgramFiles\didcomm-mcp"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item target\${{ matrix.target }}\release\didcomm-mcp.exe $dir
          python .github/scripts/smoke_test.py "$dir\didcomm-mcp.exe" --version ${{ steps.version.outputs.version }} --service
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: publish
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          cat *.sha256 | sort -k2 > SHA256SUMS
          rm *.sha256
          sha256sum -c SHA256SUMS
      - name: Release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          # This version's section of the changelog.
          awk -v v="$version" '/^## /{ if (found) exit; if ($2 == v || $2 == "["v"]") { found=1; next } } found' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "::error::CHANGELOG.md has no section for $version"; exit 1; fi
          cat >> notes.md <<EOF

          ## Downloads

          | Platform | Archive |
          |---|---|
          | Linux x86_64 (static, any distribution) | [didcomm-mcp-x86_64-unknown-linux-musl.tar.gz](https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/didcomm-mcp-x86_64-unknown-linux-musl.tar.gz) |
          | Linux ARM64 (static, any distribution) | [didcomm-mcp-aarch64-unknown-linux-musl.tar.gz](https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/didcomm-mcp-aarch64-unknown-linux-musl.tar.gz) |
          | macOS Apple silicon | [didcomm-mcp-aarch64-apple-darwin.tar.gz](https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/didcomm-mcp-aarch64-apple-darwin.tar.gz) |
          | macOS Intel | [didcomm-mcp-x86_64-apple-darwin.tar.gz](https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/didcomm-mcp-x86_64-apple-darwin.tar.gz) |
          | Windows x64 | [didcomm-mcp-x86_64-pc-windows-msvc.zip](https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/didcomm-mcp-x86_64-pc-windows-msvc.zip) |
          | Windows ARM64 | [didcomm-mcp-aarch64-pc-windows-msvc.zip](https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/didcomm-mcp-aarch64-pc-windows-msvc.zip) |

          Checksums are in \`SHA256SUMS\`. Installing, connecting an MCP host, configuring it and
          running it as a service: [docs/install.md](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/docs/install.md).
          EOF
          cat notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "didcomm-mcp ${GITHUB_REF_NAME#v}" --notes-file notes.md --verify-tag
